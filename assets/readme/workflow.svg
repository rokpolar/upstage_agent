<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="256" viewBox="0 0 1200 256" role="img" aria-labelledby="title desc">
  <title id="title">Upstage Agent 문서 처리 구조</title>
  <desc id="desc">Upstage Studio가 품의·결의 문서를 읽고, Python 코드가 규칙을 검증합니다. 담당자가 확인한 정보로 DOCX·PDF 양식을 작성합니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 7 4 1 7" fill="none" stroke="#64748b" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect width="1200" height="256" rx="16" fill="#f8fafc"/>
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <path d="M284 128H316"/>
    <path d="M584 128H616"/>
    <path d="M884 128H916"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
    <g id="extraction" transform="translate(24 32)">
      <rect width="252" height="192" rx="10" fill="#fff" stroke="#dbe3ec"/>
      <text x="24" y="42" font-size="24" font-weight="600" fill="#3b6da8">01</text>
      <text x="126" y="109" text-anchor="middle" font-size="44" font-weight="600" fill="#0f172a">문서 추출</text>
      <text x="126" y="157" text-anchor="middle" font-size="24" fill="#64748b">Upstage Studio</text>
    </g>
    <g id="validation" transform="translate(324 32)">
      <rect width="252" height="192" rx="10" fill="#fff" stroke="#dbe3ec"/>
      <text x="24" y="42" font-size="24" font-weight="600" fill="#3b6da8">02</text>
      <text x="126" y="109" text-anchor="middle" font-size="44" font-weight="600" fill="#0f172a">규칙 검증</text>
      <text x="126" y="157" text-anchor="middle" font-size="24" fill="#64748b">Python</text>
    </g>
    <g id="review" transform="translate(624 32)">
      <rect width="252" height="192" rx="10" fill="#fff" stroke="#dbe3ec"/>
      <text x="24" y="42" font-size="24" font-weight="600" fill="#3b6da8">03</text>
      <text x="126" y="109" text-anchor="middle" font-size="44" font-weight="600" fill="#0f172a">검토·확정</text>
      <text x="126" y="157" text-anchor="middle" font-size="24" fill="#64748b">담당자 확인</text>
    </g>
    <g id="document-output" transform="translate(924 32)">
      <rect width="252" height="192" rx="10" fill="#fff" stroke="#dbe3ec"/>
      <text x="24" y="42" font-size="24" font-weight="600" fill="#3b6da8">04</text>
      <text x="126" y="109" text-anchor="middle" font-size="44" font-weight="600" fill="#0f172a">양식 작성</text>
      <text x="126" y="157" text-anchor="middle" font-size="24" fill="#64748b">DOCX · PDF</text>
    </g>
  </g>
</svg>

# docker compose up -d --build   →  http://127.0.0.1:8766
name: gyeolui-agent

services:
  app:
    build:
      context: .
    init: true
    restart: unless-stopped
    ports:
      # 호스트의 127.0.0.1에만 연다. 포트를 바꾸려면 APP_DOCKER_PORT=8767 docker compose up -d
      - "127.0.0.1:${APP_DOCKER_PORT:-8766}:8766"
    # 키·Agent 설정은 이미지에 넣지 않고 .env를 환경변수로 넘긴다(앱은 환경변수를 먼저 읽는다).
    # 파일 하나를 붙이면 편집기가 .env를 바꿔 쓸 때 컨테이너가 옛 파일을 잃으므로 env_file을 쓴다.
    # .env를 고친 뒤에는 docker compose up -d --force-recreate
    env_file:
      - path: ./.env
        required: false
    environment:
      N8N_WEBHOOK_BASE_URL: ${N8N_DOCKER_WEBHOOK_BASE_URL:-http://n8n:5678/webhook}
    # 페이지별 업로드·결과는 RAM 임시 공간만 사용한다. 호스트 볼륨에 저장하지 않는다.
    tmpfs:
      - /tmp:mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/healthz', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    stop_grace_period: 10s
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.49.5
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_DOCKER_PORT:-5678}:5678"
    environment:
      GENERIC_TIMEZONE: Asia/Seoul
      TZ: Asia/Seoul
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz/readiness').then(r => {if (!r.ok) process.exitCode = 1}).catch(() => process.exitCode = 1)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  n8n_data:
